# 板卡健康监测与可插拔恢复机制 专用真机验收场景（ADR-016，QA-GAP-01）
# 用途：正式执行 TC-BH-001~003 + TC-RCV-001~005 的官方入口。
# tasks 照搬 stress.yaml（photo×11 + video×2 代表组合 + video_integrity + rtmp），
# loop/preview/rtmp duration 也照搬 stress 原文；但 prepare 保持 recovery 冷启动顺序
# （power_switch_init → serial_init，不能照搬 stress 旧顺序，契约校验会强制）。
scenario:
  name: recovery_validation
  preview:
    enabled: true           # 照搬 stress（开启画面观察）

  health_monitor:
    enabled: true           # 启用板卡健康监测（watchdog + active probe）

  recovery:
    enabled: true
    backend: power_cycle    # 唯一后端（ADR-016 第一阶段）
    max_attempts: 2         # 最多自动恢复 2 次，超过 abort
    after_recovery: retry_current_task
    on_exhausted: abort_scenario
    restore:                # PowerCycle 后环境重新收敛（严格按顺序）
      - serial_reconnect    # 先重建 EVB UART transport（NEW-P0-06）
      - board_ready
      - wifi_connect
      - preclean
      - ftp_ready

  prepare:
    - power_switch_init     # NEW-P0-05：先识别控制器并上电 EVB（冷启动前置）
    - serial_init           # 再等 EVB UART 枚举 + 打开
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start         # preview.enabled=true 需要挂 preview_start
    - health_monitor_start

  loop:
    enable: true
    count: 200

  tasks:
    # photo 按模式拆成 11 个 task，每个模式单元素 photo_modes + 独立 repeat，
    # 以便后续单独调整某一模式的 repeat 次数（本次全部 = 1，与拆分前遍历 11 模式等价）。
    # photo_modes 为结构化映射 {mode, size?, num?}（ADR-018，硬切，旧字符串形式报错）：
    #   命令由 drivers/photo_commands.py 拼装，single 的尺寸须经 size 关键字下发。
    # hdr 用 {mode: hdr, num: <0-3>} 表达连拍张数；heif 为独立模式名 {mode: heif}。
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: auto}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 1080p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 720p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 480p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: mfnr}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 0}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 1}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 2}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 3}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif}]
    # 恢复验证不关心分辨率矩阵，只保留 2 个代表组合（1080p / 3k）。
    # 完整全参数排列见 video_matrix.yaml（150 条）；override 的 video_params 整体替换
    # 模块默认值，7 个键必须写全。
    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    # 录像完成后统一做 H265 完整性检测：检本轮全部未检文件，跨 loop 靠 manifest 去重不重复检。
    # 不能用 latest_unchecked（只检最新 1 个，会漏掉其余已下载文件）。
    - module: video_integrity
      override:
        input:
          source: "current_run"
          selection: "all_unchecked"   # 检本轮全部未检文件；跨 loop 靠 manifest 去重不重复检
          empty_input_policy: "skip"   # 某 size 录像失败/未下载时不判 FAIL，跳过而非双重惩罚
    - module: rtmp
      duration: 600
  cleanup:
    - health_monitor_stop   # 必须先于 close_serial/power_switch_close（防误判）
    - stop_stream
    - preview_stop          # preview 开启后需关闭 ffplay 窗口
    - close_serial
    - power_switch_close
