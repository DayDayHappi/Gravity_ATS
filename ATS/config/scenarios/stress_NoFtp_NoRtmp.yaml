# 压测场景：photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次
scenario:
  name: stress_NoFtp_NoRtmp
  preview:
    enabled: true
  prepare:
    - serial_init
    - power_switch_init
    - preclean
  loop:
    enable: true
    count: 200
  tasks:
    # photo 按模式拆成 11 个 task，每个模式单元素 photo_modes + 独立 repeat，
    # 以便后续单独调整某一模式的 repeat 次数（本次全部 = 1，与拆分前遍历 11 模式等价）。
    # hdr 0~3 已真机核实为「带参数形式」（cam_set photo hdr <0-3>），非下划线独立名 hdr_0~3。
    # single 1080p/720p/480p 三个含空格模式名仍需真机核实（见 archive/新增需求_photo单拍分辨率变体.md）。
    # heif 可能是独立模式名（cam_set photo heif），也可能带参数，待真机核实。
    - module: photo
      repeat: 1
      override:
        photo_modes: [auto]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [single]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 1080p]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 720p]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 480p]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [mfnr]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 0]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 1]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 2]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 3]
        ftp_download: false
    # TODO-CONFIRM：heif 可能是独立模式名 cam_set photo heif，也可能带参数
    # （类似 cam_set photo hdr <0-3>），真机核实时需确认；若带参数需改 photo_modes: ["heif <参数>"]。
    - module: photo
      repeat: 1
      override:
        photo_modes: [heif]
        ftp_download: false
    # video 代表组合：6 档分辨率 × h265 × 30fps × eis 2（3k 仅支持 eis 2），
    # 完整全参数排列见 video_matrix.yaml（168 条）。override 的 video_params 整体替换
    # 模块默认值，7 个键必须写全。
    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "4k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "sd1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "720p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "480p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

  cleanup:
    - power_switch_close
    - close_serial
