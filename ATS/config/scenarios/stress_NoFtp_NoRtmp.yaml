# 压测场景：photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次
scenario:
  name: stress_NoFtp_NoRtmp
  preview:
    enabled: true
  prepare:
    - serial_init
    - power_switch_init
    - preclean
  loop:
    enable: true
    count: 200
  tasks:
    # photo 按模式拆成 11 个 task，每个模式单元素 photo_modes + 独立 repeat，
    # 以便后续单独调整某一模式的 repeat 次数（本次全部 = 1，与拆分前遍历 11 模式等价）。
    # photo_modes 为结构化映射 {mode, size?, num?}（ADR-018，硬切，旧字符串形式报错）：
    #   命令由 drivers/photo_commands.py 拼装，single 的尺寸须经 size 关键字下发。
    # hdr 用 {mode: hdr, num: <0-3>} 表达连拍张数；heif 为独立模式名 {mode: heif}。
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: auto}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 1080p}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 720p}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 480p}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: mfnr}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 0}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 1}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 2}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, num: 3}]
        ftp_download: false
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif}]
        ftp_download: false
    # video 代表组合：6 档分辨率 × h265 × 30fps × eis 2（3k 仅支持 eis 2），
    # 完整全参数排列见 video_matrix.yaml（150 条）。override 的 video_params 整体替换
    # 模块默认值，7 个键必须写全。
    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "4k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "sd1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "720p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "480p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
        ftp_download: false

  cleanup:
    - power_switch_close
    - close_serial
