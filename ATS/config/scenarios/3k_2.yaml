# 3k_2 单轮录像 + H265 完整性检测场景（loop.count 控制轮次）
#
# TODO-CONFIRM（原样同步自 new_arch，未擅改）：
#  1. 顶部旧注释「photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次」与本文件实际
#     tasks（仅 video 20s + video_integrity）及 loop.count: 200 不符，待确认目标配置。
#  2. prepare 无 power_switch_init，但 cleanup 有 power_switch_close（close 幂等，
#     无实例直接 return，不会报错；是否需要配套 init 待确认）。
#  3. preview.enabled: true 但 prepare 无 preview_start，实际不会开预览窗口。
scenario:
  name: 3k_2
  preview:
    enabled: true
  prepare:
    - serial_init
    - wifi_connect
    - preclean
    - ftp_ready
  loop:
    enable: true
    count: 200
  tasks:
    # 3k_2: 预期 2268x3024 竖屏（用户手测映射，非本次测量）
    - module: video
      repeat: 1
      duration: 20
      override:
        video_resolution: "3k_2"

    # 录像完成后统一做 H265 完整性检测：检本轮全部未检文件，跨 loop 靠 manifest 去重不重复检。
    # 不能用 latest_unchecked（只检最新 1 个，会漏掉 repeat>1 的其余文件）。
    - module: video_integrity
      override:
        input:
          source: "current_run"
          selection: "all_unchecked"   # 检本轮全部未检文件；跨 loop 靠 manifest 去重不重复检
          empty_input_policy: "skip"   # 某 size 录像失败/未下载时不判 FAIL，跳过而非双重惩罚
  cleanup:
    - power_switch_close
    - close_serial
