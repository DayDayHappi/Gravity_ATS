# 压测场景：photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次
scenario:
  name: stress
  preview:
    enabled: true
  prepare:
    - serial_init
    - power_switch_init
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start
  loop:
    enable: true
    count: 200
  tasks:
    # photo 实测可用命令（2026-11-20 真机验证；ADR-018 结构化 {mode, size}）。
    # 已删除原 42 枚举中的不可用项：auto/mfnr/hdr 仅 12m；single 去掉 3m/8m/w8m；
    # heif 去掉 8m/720p（暂不支持）；fcov 整体排除（持续取流会锁死板子）。
    # 顺序沿用：hdr → mfnr → auto → single → heif；single 12m 置末位（规避下一轮切换失败）。
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: mfnr, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: auto, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 1080p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 720p}]
    # - module: photo
    #   repeat: 1
    #   override:
    #     photo_modes: [{mode: single, size: 480p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 12m}]
    # - module: photo
    #   repeat: 1
    #   override:
    #     photo_modes: [{mode: heif, size: w8m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 3m}]
    # - module: photo
    #   repeat: 1
    #   override:
    #     photo_modes: [{mode: heif, size: 1080p}]
    # - module: photo
    #   repeat: 1
    #   override:
    #     photo_modes: [{mode: heif, size: 480p}]
    # video 实测可用集：由 43 条收缩为 16 条 active（收缩决策 2026-11-23，其余整块注释保留便于恢复）。
    # active 16 条 = 3k×1 + 1080p×3 + sd1080p×4 + 720p×4 + 480p×4（每档保留 h265 为主，1080p/720p/480p 另留 h264 变体各按需）。
    # 命令来源真机 43/43 PASS（2026-11-23，video_only.yaml）；固定 bitrate 18000000 / gop 30 / vui 709；每条 duration 20（stress 语义）。
    # 每条 ftp_download: false（只录像不下载）→ 无下载产物，故本场景不做 video_integrity 检测。
    # 下方带 # 的整块 task 为已注释保留项（其余 27 条），未删除以便后续恢复；启用时去掉行首 # 即可。
    # 已排除（不启用）：3k/1080p × fps60（固件拒）、sd1080p fps60 eis2 h265（stop 挂死）。无 4k。
    # 每个 task 参数必须 7 键写全：override 的 video_params 整体替换模块默认值，不按单键合并。
    # ── 3k / fps 30 / eis 2 ──
    # - module: video
    #   repeat: 1
    #   duration: 20
    #   override:
    #     ftp_download: false
    #     video_params:
    #       res: "3k"
    #       fps: 30
    #       eis: 2
    #       codec: "h264"
    #       bitrate: 18000000
    #       gop: 30
    #       vui: "709"
    - module: video
      repeat: 1
      duration: 20
      override:
        ftp_download: false
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 18000000
          gop: 30
          vui: "709"
    # ── 1080p / fps 30 / eis 0 ──
    # - module: video
    #   repeat: 1
