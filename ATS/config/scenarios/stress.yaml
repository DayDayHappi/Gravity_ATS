# 压测场景：photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次
scenario:
  name: stress
  preview:
    enabled: true
  prepare:
    - serial_init
    - power_switch_init
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start
  loop:
    enable: true
    count: 200
  tasks:
    # photo 按模式拆成 12 个 task，每个模式单元素 photo_modes + 独立 repeat，
    # 以便后续单独调整某一模式的 repeat 次数（本次全部 = 1）。
    # 顺序：hdr 0~3 → mfnr → auto → single → single 1080p/720p/480p → single 12m，
    # 末尾补 12m 属规避下一轮切换失败的既有实践（勿随意调整顺序）。
    # hdr 0~3 已真机核实为「带参数形式」（cam_set photo hdr <0-3>），非下划线独立名 hdr_0~3。
    # single 1080p/720p/480p 三个含空格模式名仍需真机核实（见 archive/新增需求_photo单拍分辨率变体.md）。
    # heif 可能是独立模式名（cam_set photo heif），也可能带参数，待真机核实。
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 0]
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 1]
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 2]
    - module: photo
      repeat: 1
      override:
        photo_modes: [hdr 3]
    - module: photo
      repeat: 1
      override:
        photo_modes: [mfnr]
    - module: photo
      repeat: 1
      override:
        photo_modes: [auto]
    - module: photo
      repeat: 1
      override:
        photo_modes: [single]
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 1080p]
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 720p]
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 480p]
    - module: photo
      repeat: 1
      override:
        photo_modes: [single 12m]

    # TODO-CONFIRM：heif 可能是独立模式名 cam_set photo heif，也可能带参数
    # （类似 cam_set photo hdr <0-3>），真机核实时需确认；若带参数需改 photo_modes: ["heif <参数>"]。
    - module: photo
      repeat: 1
      override:
        photo_modes: [heif]
    # video 代表组合：6 档分辨率 × h265 × 30fps × eis 2（3k 仅支持 eis 2），
    # 完整全参数排列见 video_matrix.yaml（168 条）。每个 task 参数必须 7 键写全：
    # override 的 video_params 整体替换模块默认值，不按单键合并。
    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "4k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "sd1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "720p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "480p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    # 录像完成后统一做 H265 完整性检测：检本轮全部未检文件，跨 loop 靠 manifest 去重不重复检。
    # 不能用 latest_unchecked（只检最新 1 个，会漏掉其余已下载文件）。
    - module: video_integrity
      override:
        input:
          source: "current_run"
          selection: "all_unchecked"   # 检本轮全部未检文件；跨 loop 靠 manifest 去重不重复检
          empty_input_policy: "skip"   # 某 size 录像失败/未下载时不判 FAIL，跳过而非双重惩罚
    - module: rtmp
      duration: 600
  cleanup:
    - stop_stream
    - preview_stop
    - power_switch_close
    - close_serial
