# 压测场景：photo 50 次 + video 3min + rtmp 10min，整轮循环 3 次
scenario:
  name: stress
  preview:
    enabled: true
  prepare:
    - serial_init
    - power_switch_init
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start
  loop:
    enable: true
    count: 200
  tasks:
    # photo 实测可用命令（2026-11-20 真机验证；ADR-018 结构化 {mode, size}）。
    # 已删除原 42 枚举中的不可用项：auto/mfnr/hdr 仅 12m；single 去掉 3m/8m/w8m；
    # heif 去掉 8m/720p（暂不支持）；fcov 整体排除（持续取流会锁死板子）。
    # 顺序沿用：hdr → mfnr → auto → single → heif；single 12m 置末位（规避下一轮切换失败）。
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: hdr, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: mfnr, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: auto, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 1080p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 720p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 480p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: single, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 12m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: w8m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 3m}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 1080p}]
    - module: photo
      repeat: 1
      override:
        photo_modes: [{mode: heif, size: 480p}]
    # video 代表组合：6 档分辨率 × h265 × 30fps × eis 2（3k 仅支持 eis 2），
    # 完整全参数排列见 video_matrix.yaml（168 条）。每个 task 参数必须 7 键写全：
    # override 的 video_params 整体替换模块默认值，不按单键合并。
    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "4k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "sd1080p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "720p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    - module: video
      repeat: 1
      duration: 20
      override:
        video_params:
          res: "480p"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"

    # 录像完成后统一做 H265 完整性检测：检本轮全部未检文件，跨 loop 靠 manifest 去重不重复检。
    # 不能用 latest_unchecked（只检最新 1 个，会漏掉其余已下载文件）。
    - module: video_integrity
      override:
        input:
          source: "current_run"
          selection: "all_unchecked"   # 检本轮全部未检文件；跨 loop 靠 manifest 去重不重复检
          empty_input_policy: "skip"   # 某 size 录像失败/未下载时不判 FAIL，跳过而非双重惩罚
    - module: rtmp
      duration: 600
  cleanup:
    - stop_stream
    - preview_stop
    - power_switch_close
    - close_serial
