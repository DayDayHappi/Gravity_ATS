# 压测场景：遍历全部拍照模式 + 3k 录像（video/rtmp 时长与整轮循环次数自行按需配置）
# 与 stress_traverse_photo_mode.yaml 唯一差异：video task 用 override.video_params 强制 3k
# 录像（不碰 config/modules/video.yaml 的全局默认）。3k 仅支持 30fps / eis 2。
# 其余（preview/prepare/loop/video_integrity/rtmp/cleanup）与源文件完全一致。
scenario:
  name: stress_traverse_photo_mode_3k
  preview:
    enabled: true
  prepare:
    - serial_init
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start
  loop:
    enable: true
    count: 200
  tasks:
    - module: photo
      repeat: 1            # Runner 每轮 repeat 都完整遍历一次 photo_modes
      override:
        # photo_modes 为结构化映射 {mode, size?, num?}（ADR-018，硬切，旧字符串形式报错）：
        #   命令由 drivers/photo_commands.py 拼装；hdr 用 num 表达连拍张数。
        photo_modes:
          - {mode: auto}
          - {mode: single}
          - {mode: mfnr}
          - {mode: hdr, num: 0}
          - {mode: hdr, num: 1}
          - {mode: hdr, num: 2}
          - {mode: hdr, num: 3}
    - module: video
      duration: 66
      override:
        video_params:                     # 唯一新增：3k 录像（覆写模块默认参数）
          res: "3k"
          fps: 30
          eis: 2
          codec: "h265"
          bitrate: 8000000
          gop: 30
          vui: "709"
    - module: video_integrity
      override:
        input:
          source: "current_run"          # 扫本次 run 的 videos/ 目录（与 video.py tmp_dir 对齐）
          selection: "latest_unchecked"  # 每轮只检最新未检文件（manifest 去重，防 200 轮重复检）
          empty_input_policy: "skip"     # 录像失败/下载缺失时不判 FAIL，跳过而非双重惩罚
    - module: rtmp
      duration: 66
  cleanup:
    - stop_stream
    - preview_stop
    - close_serial
