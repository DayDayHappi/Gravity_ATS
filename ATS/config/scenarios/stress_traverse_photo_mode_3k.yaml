# 压测场景：遍历全部拍照模式 + 3k 录像（video/rtmp 时长与整轮循环次数自行按需配置）
# 与 stress_traverse_photo_mode.yaml 唯一差异：video task 用 override.video_resolution=3k
# 强制 3k 录像（不碰 config/modules/video.yaml 的全局默认 1080p）。
# 其余（preview/prepare/loop/video_integrity/rtmp/cleanup）与源文件完全一致。
scenario:
  name: stress_traverse_photo_mode_3k
  preview:
    enabled: true
  prepare:
    - serial_init
    - wifi_connect
    - preclean
    - ftp_ready
    - preview_start
  loop:
    enable: true
    count: 200
  tasks:
    - module: photo
      repeat: 1            # Runner 每轮 repeat 都完整遍历一次 photo_modes
      override:
        # TODO-CONFIRM：7 个模式名需真机核实是否为固件支持的合法 cam_set photo <mode> 参数。
        # 依据 photo.yaml 注释 + 需求文档；注意 archive 软件需求文档 L483 记为
        # "cam_set photo hdr <0-3>"（hdr 带参数），与这里的 hdr_0~3 独立命名可能不一致，
        # 真机核实时需确认 hdr 到底用独立模式名还是参数形式。
        photo_modes: [auto, single, mfnr, hdr_0, hdr_1, hdr_2, hdr_3]
    - module: video
      duration: 66
      override:
        video_resolution: "3k"          # 唯一新增：3k 录像（覆写模块默认 1080p）
    - module: video_integrity
      override:
        input:
          source: "current_run"          # 扫本次 run 的 videos/ 目录（与 video.py tmp_dir 对齐）
          selection: "latest_unchecked"  # 每轮只检最新未检文件（manifest 去重，防 200 轮重复检）
          empty_input_policy: "skip"     # 录像失败/下载缺失时不判 FAIL，跳过而非双重惩罚
    - module: rtmp
      duration: 66
  cleanup:
    - stop_stream
    - preview_stop
    - close_serial
