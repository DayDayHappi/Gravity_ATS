# 纯录像场景（testvideo 分支）：只录不下载（video_ftp_download=false），循环次数自行按需配置。
# 沿用 stress_traverse_photo_mode 文件名/name（日志报告落在 logs/stress_traverse_photo_mode/，
# 后续若需独立命名再重命名为 testvideo.yaml）。preview 已关（无 RTMP 流可看），ftp_ready 已移除。
scenario:
  name: stress_traverse_photo_mode
  preview:
    enabled: false
  prepare:
    - serial_init
  
    - preclean
    - preview_start
  loop:
    enable: true
    count: 20
  tasks:

    - module: video
      duration: 40
      override:
        video_ftp_download: false

  cleanup:
    - stop_stream
    - preview_stop
    - close_serial
