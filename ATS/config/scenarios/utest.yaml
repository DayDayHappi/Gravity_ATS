# utest 场景：固件板级自检（ADR-012）。
# 独立场景，不并入 normal/stress/aging：utest 与 WiFi/FTP/音视频链路无依赖，
# prepare 只 serial_init + preclean（不连 WiFi、不启 FTP、不启动 preview）。
# 8 项检测由 tasks 逐项声明 override.testcase，模块内不写 for。
# 每项脚本超时默认取 ATS/drivers/utest_commands.py 的 UTEST_TESTCASES 表；
# 如需单项覆盖，加 override.timeout（秒）。
scenario:
  name: utest
  serial_fingerprint: utest   # ADR-013：utest 固件 msh 提示符为 "msh >"（无斜杠），
                              # 用 utest 指纹集（追加认 msh >），default 场景不受影响
  preview:
    enabled: false
  prepare:
    - serial_init
    - preclean
  tasks:
    - module: utest
      override:
        testcase: efuse_test
    - module: utest
      override:
        testcase: filesystem
    - module: utest
      override:
        testcase: i2c_test
    - module: utest
      override:
        testcase: imu_test
    - module: utest
      override:
        testcase: pvt_auto_test
    - module: utest
      override:
        testcase: pvt_test
    - module: utest
      override:
        testcase: flash_xip_speed
    - module: utest
      override:
        testcase: flash_read
  cleanup:
    - close_serial
