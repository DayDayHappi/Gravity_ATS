# VX100 EVB 自动化测试默认配置
# 增删测试项：改 test.enabled_modules；改参数：改对应段。
# 敏感字段支持 ${ENV_VAR} 语法从环境变量读取。

serial:
  port: "auto"             # auto=自动探测(默认)；或填具体 /dev/ttyUSB0
  baudrate: 2000000        # 默认2000000(用户指定)；自动探测时回退候选
  baudrate_candidates: [2000000, 250000, 115200, 921600]
  timeout: 2.0
  ready_timeout: 60        # 等 msh 就绪
  sentinel_timeout: 5      # 哨兵下发确认超时
  detect_timeout: 2.0      # 自动探测时每端口读响应超时

wifi:
  default_ssid: "KhalilFong"
  default_password: "12345678"   # 默认密码(可用 ${WIFI_PASSWORD} 覆盖)
  interactive: true        # 启动时交互选择 WiFi

emmc:
  format: false            # 默认跳过格式化，仅 cd 验证

ftp:
  user: "loogg"
  password: "loogg"
  port: 21
  connect_retry: 3
  connect_interval: 1.0
  pasv: false              # 主动模式(RT-Thread FTP不支持PASV)；需PC防火墙放行入站
  timeout: 10

camera:
  photo_modes: ["auto"]    # 默认只测 auto；可扩为 [auto, single, mfnr, hdr_0, hdr_1, hdr_2, hdr_3]
  photo_min_size_kb: 10
  photo_settle_delay: 1.0  # 模式切换后稳定延时(秒)
  photo_capture_timeout: 10
  video_resolution: "1080p"
  video_duration: 10        # 录像时长(秒)——2秒约3.6MB，FTP可完整下载；5秒(10MB)会因固件FTP卡死下不完
  video_min_size_kb: 100
  video_capture_timeout: 15

rtmp:
  stream_url: "rtmp://{pc_ip}/live/cam"   # application=live, stream key=cam（对齐 nginx.conf）
  stream_duration: 10                     # 推流持续窗口(秒)：探测期间推流须在线，stop 前完成探测
  pc_ip: "auto"            # auto=自动检测，或填具体 IP（建议写死 EVB 可达的 IP，见迁移指南）
  # 使用项目内置的静态构建 ffmpeg 套件 (tools/ffmpeg/)，不依赖系统安装
  # 相对路径基于运行时 cwd（python -m ATS.main 在项目根目录执行）
  ffprobe_path: "tools/ffmpeg/ffprobe"   # ★ 必需：ffprobe 实时探测 RTMP 流（主判据）
  ffmpeg_path: "tools/ffmpeg/ffmpeg"      # 套件就绪代理（不再用于拉流存盘）
  ffplay_path: "tools/ffmpeg/ffplay"      # 可选：画面确认，无 DISPLAY 环境自动跳过
  ffplay_show_duration: 10                 # ffplay 展示窗口停留秒数：探测到流后、stop 前保持供人眼确认
  # RTMP 服务端：nginx-rtmp，由用户/系统手动启动（systemctl start nginx），脚本仅检查 1935 就绪
  # nginx.conf 需配 application live { live on; record off; } 监听 1935

test:
  enabled_modules:
    - wifi_check          # 先 ifconfig 检测，已联网则跳过 scan/join
    - wifi_scan
    - wifi_join
    - emmc
    - ftp
    - photo
    - video
    - rtmp
  retry_on_fail: 1
  fail_fast: true

report:
  output_dir: "reports"
  log_dir: "logs"
  junit: true
  html: true
