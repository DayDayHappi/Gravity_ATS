# 录像模块参数
ftp_download: true         # true=录完 FTP 下载校验大小；false=纯录像不下载（无网络场景 override）
video_resolution: "sd1080p_0"
video_duration: 180        # 录像时长(秒)；scenario 里 task.duration 可覆盖
video_min_size_kb: 100
video_capture_timeout: 15
detect_strings: [tt_error, imu_fmq_overflow]  # 录像窗口检测的关键字符串（drivers/detect_strings.py 的选择键）；空/缺省则不检测
